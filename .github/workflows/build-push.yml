name: Build-Push

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Load git submodules
      run: git submodule sync && git submodule update --init

    - name: Install hugo
      run: |
        wget https://github.com/gohugoio/hugo/releases/download/v0.136.0/hugo_extended_0.136.0_Linux-64bit.tar.gz \
        && tar -xvf hugo_extended_0.136.0_Linux-64bit.tar.gz hugo \
        && mv  hugo /usr/local/bin \
        && rm hugo_extended_0.136.0_Linux-64bit.tar.gz

    - name: Build english and french sites
      run: |
        hugo --ignoreCache -d ~/cds-website-dist
        chmod -R 755 ~/cds-website-dist

    - name: Cache build
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/cds-website-dist
        key: ${{ github.sha }}
  
  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        lang: ["fr", "en"]
    steps:
      - name: Retrieve Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/cds-website-dist
          key: ${{ github.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.0

      - name: Install html proofer
        run: gem install html-proofer

      - name: Test
        run: |
          htmlproofer ~/cds-website-dist/${{ matrix.lang }} \
            --allow_hash_href \
            --ignore_empty_alt \
            --disable_external \
            --ignore_files=/lib/,/admin/ \
            --checks=favicon

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: "fr"
            dist-id: "E27JWYHQ4915HY" 
            bucket: "cds-website-french-s3-bucket"
          - lang: "en"
            dist-id: "E3KGR0ME3JJZ19"
            bucket: "cds-website-english-s3-bucket"
    steps:
      - name: Retrieve Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/cds-website-dist
          key: ${{ github.sha }}

      - name: Configure AWS credentials using OIDC              
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::521732289257:role/digital-canada-ca-website-apply  # use for TF apply or admin access (only works on `main` branch)
          role-session-name: cache
          aws-region: ca-central-1

      - name: Deploy and invalidate cache
        run: |
          aws s3 sync ~/cds-website-dist/${{ matrix.lang }} s3://${{ matrix.bucket }}/ --delete
          aws cloudfront create-invalidation --cli-input-json "{\"DistributionId\":\"${{ matrix.dist-id}}\",\"InvalidationBatch\":{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"$(date +%s)\"}}"

      - name: Report deployment to Sentinel
        uses: cds-snc/sentinel-forward-data-action@b2160a45676f8d278982d84eef9c13d780ef4e2b # main
        with:
          input_data: '{"product": "${{ matrix.bucket }}", "version": "${{ github.sha }}", "repository": "${{ github.repository }}", "environment": "production"}'
          log_type: CDS_Product_Deployment_Data
          log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
          
  deploy-failure:
    needs: deploy
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy.result == 'failure' || needs.deploy.result == 'skipped')
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBSITE_INFINITE_WEBHOOK_URL }}
        run: |
          json='{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":red: Website deploy failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"}}]}'
          curl -X POST -H 'Content-type: application/json' --data "$json" "$SLACK_WEBHOOK_URL"