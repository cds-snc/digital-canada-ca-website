name: Shellcheck
on:
  push:
    paths:
      - "**/*.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Shellcheck
      run: |
        chmod +x .github/workflows/scripts/run-shellcheck.sh
        .github/workflows/scripts/run-shellcheck.sh



